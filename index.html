<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bmi Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main">
        <h1>BMI Calculator</h1>
        <form action="" id="form">
            <label for="height">Height</label>
            <input id="height" type="number" placeholder="in CM">
            <label for="weight">Weight</label>
            <input id="weight" type="number" placeholder="in KG">
            <button id="button">Calculte</button>
        </form>

        <div class="result">
            <h4>Your Bmi score</h4>
            <h2 id="score">50.22</h2>
        </div>
        <div class="info">
            <h4>BMI Categories for Adults</h4>
            <p>Underweight: BMI less than 18.5</p>
            <p>Healthy Weight: BMI between 18.5 and 24.9</p>
            <p>Overweight: BMI between 25.0</p>
        </div>


    </div>


<script src="main.js"></script>
</body>
</html>
